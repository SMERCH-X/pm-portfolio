<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BountyOS · Security Operations</title><style>
:root{color-scheme:dark;font:15px system-ui,Segoe UI,sans-serif;background:#0b1020;color:#e9efff}*{box-sizing:border-box}body{margin:0}aside{position:fixed;width:220px;top:0;bottom:0;background:#10192d;padding:24px 14px;border-right:1px solid #263654}aside h2{margin:0 0 34px 8px}nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#b6c8e9;padding:13px;border-radius:9px;cursor:pointer;font-size:15px}nav button.active,nav button:hover{background:#24385e;color:white}main{margin-left:220px;padding:38px 5%;max-width:1550px}h1{font-size:27px}h2{font-size:19px;margin:28px 0 14px}.muted{color:#93a8cb}.panel{border:1px solid #2a3c5b;background:#151f35;padding:20px;border-radius:13px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}.stat strong{display:block;font-size:29px;margin-top:12px}label{display:block;font-size:13px;color:#b2c9ef;margin:10px 0}input,textarea,select{display:block;width:100%;padding:12px;background:#0d172b;color:white;border:1px solid #33476a;border-radius:7px;margin-top:6px;font:inherit}textarea{min-height:85px}button.primary{background:#3c7cf0;border:0;color:white;padding:12px 20px;border-radius:7px;cursor:pointer;margin-top:10px;font-weight:650}button.primary:disabled{opacity:.5}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #2d3b55;padding:12px;text-align:left;overflow-wrap:anywhere}th{color:#a4b8d8}.scroll{overflow:auto}.ok{color:#5ee0ac}.bad{color:#ff9d9d}.alert{white-space:pre-wrap;padding:13px;border-radius:8px;background:#233957;margin:12px 0}.hidden{display:none}.small{font-size:12px}.pill{display:inline-block;border-radius:12px;padding:4px 9px;background:#193d36;color:#5ee0ac;margin:3px}code{color:#a6c4ff}@media(max-width:720px){aside{position:static;width:auto}main{margin:0;padding:18px}nav{display:flex;flex-wrap:wrap}nav button{width:auto}}
</style></head><body><aside><h2>⬡ Bounty<span style="color:#4e90ff">OS</span></h2><nav id="nav"></nav><p class="muted small" style="margin-top:35px">Bug Bounty Operations<br>Local development · v0.4</p></aside><main><p class="muted small">SECURITY OPERATIONS / BOUNTYOS</p><h1 id="heading">Обзор</h1><div id="message"></div><div id="content"></div><p class="muted small"></p></main><script>
const routes=[['overview','Обзор'],['programs','Программы'],['reports','Отчёты'],['duplicates','Дубликаты'],['score','Приоритеты'],['pulse','Аналитика']];let page='overview', cache={};
const $=s=>document.querySelector(s), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,options={}){let r=await fetch(url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let t=await r.text(),data;try{data=JSON.parse(t)}catch{data=t}if(!r.ok)throw Error(typeof data==='object'?JSON.stringify(data.detail??data):data);return data}
const get=(s,path)=>api('/api/'+s+'/api/v1/'+path);const post=(s,path,data)=>api('/api/'+s+'/api/v1/'+path,{method:'POST',body:JSON.stringify(data)});
function notify(msg,error=false){$('#message').innerHTML='<div class="alert '+(error?'bad':'ok')+'">'+esc(msg)+'</div>'}
function form(fields,button,id){return `<form id="${id}" class="panel"><div class="grid">${fields.map(([name,label,type='text',extra=''])=>`<label>${label}${type==='textarea'?`<textarea name="${name}" ${extra} required></textarea>`:type==='select'?`<select name="${name}" ${extra}></select>`:`<input name="${name}" type="${type}" ${extra} required>`}</label>`).join('')}</div><button class="primary">${button}</button></form>`}
function table(rows,cols){return rows.length?`<div class="panel scroll"><table><thead><tr>${cols.map(c=>'<th>'+c[1]+'</th>').join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+cols.map(c=>'<td>'+esc(typeof c[0]==='function'?c[0](r):r[c[0]])+'</td>').join('')+'</tr>').join('')}</tbody></table></div>`:'<div class="panel muted">Записей пока нет.</div>'}
function values(form){let d=Object.fromEntries(new FormData(form));return d}function bind(id,fn){$('#'+id).onsubmit=async e=>{e.preventDefault();let btn=e.target.querySelector('button');btn.disabled=true;try{await fn(values(e.target));await render()}catch(err){notify('Ошибка: '+err.message,true)}finally{btn.disabled=false}}}
function selectOptions(sel,items,key='id',name='name'){sel.innerHTML=items.map(x=>`<option value="${esc(x[key])}">${esc(x[name])}</option>`).join('')}
async function load(){const jobs=[['programs',get('scope','programs')],['reports',get('reports','reports')],['comparisons',get('duplicates','comparisons')],['assessments',get('score','assessments')],['events',get('pulse','events')],['metrics',get('pulse','metrics')],['status',api('/api/status')]];const out=await Promise.allSettled(jobs.map(x=>x[1]));cache={};out.forEach((v,i)=>{cache[jobs[i][0]]=v.status==='fulfilled'?v.value:jobs[i][0]==='metrics'||jobs[i][0]==='status'?{}:[];if(v.status==='rejected')cache.error=(cache.error||[]).concat(jobs[i][0]+': '+v.reason.message)})}
function stats(){return `<div class="grid">${[['Программ',cache.programs.length],['Отчётов',cache.reports.length],['Оценок риска',cache.assessments.length],['Событий',cache.events.length]].map(x=>`<div class="panel stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><h2>Состояние сервисов</h2><div class="panel">${Object.entries(cache.status).map(([k,v])=>`<span class="pill" style="${v?'':'color:#ffaaaa;background:#512b35'}">${esc(k)}: ${v?'OK':'OFFLINE'}</span>`).join('')}</div><h2>Последние отчёты</h2>${table(cache.reports.slice(0,8),[['title','Название'],['asset','Актив'],['severity','Критичность'],['id','ID']])}`}
async function programs(){let html='<h2>Создать программу</h2>'+form([['name','Название'],['policy','Правила программы','textarea'],['reward_budget','Бюджет наград','number','min="0" step="0.01"']], 'Создать программу','program-form');html+='<h2>Добавить разрешённый актив</h2>'+form([['program_id','Программа','select'],['target','Адрес актива (например demo.example.com)'],['notes','Примечание','text','value="Тестовый актив"']], 'Добавить актив','asset-form');html+='<h2>Все программы</h2>'+table(cache.programs,[['name','Название'],['reward_budget','Бюджет'],['id','ID']]);$('#content').innerHTML=html;selectOptions($('#asset-form [name=program_id]'),cache.programs);bind('program-form',d=>post('scope','programs',{...d,reward_budget:Number(d.reward_budget)}));bind('asset-form',d=>post('scope','assets',{...d,in_scope:true}));}
async function reports(){let html='<h2>Новый отчёт — автоматическая обработка</h2><p class="muted">После отправки система проверяет scope, сравнивает дубликаты, рассчитывает приоритет и создаёт событие.</p>'+form([['program_id','Программа','select'],['asset','Разрешённый актив','select'],['title','Название уязвимости'],['description','Описание','textarea'],['severity','Критичность','select'],['asset_criticality','Важность актива (1–5)','number','min="1" max="5" value="3"'],['exploitability','Эксплуатируемость (1–5)','number','min="1" max="5" value="3"']], 'Отправить и обработать','report-form');html+='<h2>История отчётов</h2>'+table(cache.reports,[['title','Название'],['asset','Актив'],['severity','Критичность'],['id','ID']]);$('#content').innerHTML=html;const program=$('#report-form [name=program_id]');selectOptions(program,cache.programs);selectOptions($('#report-form [name=severity]'),[{id:'low',name:'Low'},{id:'medium',name:'Medium'},{id:'high',name:'High'},{id:'critical',name:'Critical'}]);async function refreshAssets(){let sel=$('#report-form [name=asset]');sel.innerHTML='';if(!program.value)return;try{let assets=await get('scope','assets/'+encodeURIComponent(program.value));selectOptions(sel,assets.filter(x=>x.in_scope),'target','target')}catch(e){notify('Не удалось загрузить активы: '+e.message,true)}}program.onchange=refreshAssets;await refreshAssets();bind('report-form',async d=>{if(!d.asset)throw Error('Сначала добавь разрешённый актив в разделе «Программы».');let result=await api('/api/workflow/submit',{method:'POST',body:JSON.stringify({...d,asset_criticality:Number(d.asset_criticality),exploitability:Number(d.exploitability)})});window.lastResult=result;});const original=$('#report-form').onsubmit;$('#report-form').onsubmit=async e=>{await original(e);if(window.lastResult){let r=window.lastResult;notify('Отчёт '+r.report.id+' создан. Приоритет: '+(r.priority?.tier||'не рассчитан')+'. Событие: '+(r.event?'создано':'не создано')+(r.warnings.length?'\nПредупреждения: '+r.warnings.join('; '):''),!!r.warnings.length);window.lastResult=null}}}
function duplicates(){return '<h2>Кандидаты в дубликаты</h2><p class="muted">Сравнения появляются только при схожести от 0.5; отсутствие записей не означает ошибку.</p>'+table(cache.comparisons,[['report_id','Отчёт'],['candidate_id','Похожий отчёт'],['id','ID сравнения']])}
function scores(){return '<h2>Сохранённые оценки риска</h2>'+table(cache.assessments,[['report_id','Отчёт'],['severity','Критичность'],['score','Баллы'],['tier','Приоритет'],['created_at','Дата']])}
function pulse(){let m=cache.metrics||{};return `<div class="grid">${[['Всего событий',m.total_events??0],['Уникальных отчётов',m.unique_reports??0],['Типов событий',Object.keys(m.by_type||{}).length]].map(x=>`<div class="panel stat">${x[0]}<strong>${x[1]}</strong></div>`).join('')}</div><h2>События по типам</h2>${table(Object.entries(m.by_type||{}).map(([type,count])=>({type,count})),[['type','Тип'],['count','Количество']])}<h2>Журнал событий</h2>${table(cache.events,[['report_id','Отчёт'],['event_type','Тип'],['program_id','Программа'],['created_at','Дата']])}`}
async function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#heading').textContent=routes.find(x=>x[0]===page)[1];$('#message').innerHTML='';$('#content').innerHTML='<div class="panel muted">Загрузка...</div>';try{await load();if(cache.error)notify('Некоторые сервисы недоступны: '+cache.error.join(' | '),true);if(page==='overview')$('#content').innerHTML=stats();else if(page==='programs')await programs();else if(page==='reports')await reports();else if(page==='duplicates')$('#content').innerHTML=duplicates();else if(page==='score')$('#content').innerHTML=scores();else $('#content').innerHTML=pulse()}catch(e){notify('Ошибка загрузки: '+e.message,true)}}
$('#nav').innerHTML=routes.map(([id,label])=>`<button data-page="${id}">${label}</button>`).join('');document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});render();
</script></body></html>
