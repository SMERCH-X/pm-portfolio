services:
  bounty-scope:
    build: ./bounty-scope
    ports: ["8101:8000"]
    volumes: ["bounty_scope_data:/data"]
  report-flow:
    build: ./report-flow
    ports: ["8102:8000"]
    volumes: ["report_flow_data:/data"]
  duplicate-hunter:
    build: ./duplicate-hunter
    ports: ["8103:8000"]
    volumes: ["duplicate_hunter_data:/data"]
  bounty-score:
    build: ./bounty-score
    ports: ["8104:8000"]
    volumes: ["bounty_score_data:/data"]
  bounty-pulse:
    build: ./bounty-pulse
    ports: ["8105:8000"]
    volumes: ["bounty_pulse_data:/data"]
volumes:
  bounty_scope_data:
  report_flow_data:
  duplicate_hunter_data:
  bounty_score_data:
  bounty_pulse_data:
